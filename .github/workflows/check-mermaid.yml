name: Check mermaid diagram

# GitHub renders mermaid client-side, so a syntax error does not fail any
# build. It just shows a red error box on the profile that only a human
# looking at the page would notice. This turns that into a CI failure.

on:
  push:
    paths:
      - "README.md"
      - ".github/workflows/check-mermaid.yml"
  pull_request:
    paths:
      - "README.md"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Extract mermaid blocks
        id: extract
        run: |
          mkdir -p .mermaid-check
          awk '
            /^```mermaid$/ { n++; f = 1; next }
            /^```$/        { f = 0 }
            f              { print > (".mermaid-check/block-" n ".mmd") }
          ' README.md

          count=$(ls .mermaid-check/*.mmd 2>/dev/null | wc -l)
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "Found $count mermaid block(s)."

          # A README that silently loses its diagram is also a failure worth
          # catching, since the surrounding prose still refers to it.
          if [[ "$count" -eq 0 ]]; then
            echo "::error::No mermaid block found in README.md"
            exit 1
          fi

      - name: Validate each block
        run: |
          # mermaid-cli drives headless Chromium, which cannot use its own
          # sandbox on the runner. Safe here: the only input is this repo's
          # own README, rendered in a throwaway container.
          echo '{"args":["--no-sandbox","--disable-setuid-sandbox"]}' > .mermaid-check/puppeteer.json

          # A parse error makes mermaid-cli exit non-zero, so rendering is
          # the validation. The SVG output itself is discarded.
          for f in .mermaid-check/*.mmd; do
            echo "Checking $f"
            npx -y @mermaid-js/mermaid-cli@11 \
              -p .mermaid-check/puppeteer.json \
              -i "$f" -o "$f.svg" >/dev/null
          done
          echo "All ${{ steps.extract.outputs.count }} block(s) parsed."
