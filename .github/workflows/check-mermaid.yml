name: Check mermaid diagram

# GitHub renders mermaid client-side, so bad syntax shows a red error box on
# the profile instead of failing anything. This catches it in CI instead.

on:
  push:
    paths:
      - "README.md"
      - ".github/workflows/check-mermaid.yml"
  pull_request:
    paths:
      - "README.md"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Extract mermaid blocks
        id: extract
        run: |
          mkdir -p .mermaid-check
          awk '
            /^```mermaid$/ { n++; f = 1; next }
            /^```$/        { f = 0 }
            f              { print > (".mermaid-check/block-" n ".mmd") }
          ' README.md

          count=$(ls .mermaid-check/*.mmd 2>/dev/null | wc -l)
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "Found $count mermaid block(s)."

          if [[ "$count" -eq 0 ]]; then
            echo "::error::No mermaid block found in README.md"
            exit 1
          fi

      - name: Validate each block
        run: |
          # Chromium can't sandbox itself on the runner.
          echo '{"args":["--no-sandbox","--disable-setuid-sandbox"]}' > .mermaid-check/puppeteer.json

          # Rendering is the check: mermaid-cli exits non-zero on a parse error.
          for f in .mermaid-check/*.mmd; do
            echo "Checking $f"
            npx -y @mermaid-js/mermaid-cli@11 \
              -p .mermaid-check/puppeteer.json \
              -i "$f" -o "$f.svg" >/dev/null
          done
          echo "All ${{ steps.extract.outputs.count }} block(s) parsed."
